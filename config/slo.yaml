service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # A request is "good" only if it succeeded AND answered within 3 s,
    # so failures and slow answers burn the same budget.
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  baseline:
    # Measured 2026-09-29 on the fake LLM, 11 requests, no incident enabled.
    latency_p50_ms: 152
    latency_p95_ms: 157
    ttft_p95_ms: 50
    error_rate_pct: 0
    avg_cost_usd_per_request: 0.00195
  error_budget:
    formula: 'allowed_bad_requests = (1 - 0.995) * total_requests_in_28d'
    example: '10,000 requests in 28d -> 50 bad requests allowed; 1 request/min -> 40,320 requests -> 201 allowed'
    burn_rate: 'bad_ratio_in_window / 0.005'
    fast_burn_page: 'burn_rate >= 14.4 over 1h (2% of the 28d budget spent in one hour)'
  note: >-
    The 3000 ms line is kept equal to the dashboard latency threshold so the chart and
    the SLO never disagree. It is ~19x the fake-LLM baseline P95 (157 ms) on purpose:
    it describes when a chat user perceives the answer as too slow, not how fast the
    fake model happens to be. A real LLM typically has P95 of 1-3 s, so tightening it to
    the baseline would page on normal model variance. Early warning below the SLO line
    is the job of alert slow_responses_p95 (2000 ms).
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
